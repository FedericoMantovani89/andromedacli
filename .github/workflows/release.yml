# Pushing a tag `v<version>` builds the Windows installer and publishes it as a GitHub release.
# The tag must match the version in package.json (the installer and the app take their version from there).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # creating the release and uploading the installer

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: The tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci

      - name: Check (texts, literals, types)
        run: npm run check

      - name: Build the installer
        run: npm run dist

      - name: Smoke test of the unpacked app
        run: npm run smoke:app

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" "release/AndromedaCli-Setup-$version.exe" \
            --title "AndromedaCli $version" --generate-notes
