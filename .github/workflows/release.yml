# Pushing a tag `v<version>` builds the Windows installer and publishes it as a GitHub release.
# The tag is the version: it is written into package.json for this build only (nothing is committed back), so the installer
# name and the version the app shows follow it. A version with a dash (v1.2.3-beta.1) is published as a pre-release.
#
# Two jobs on purpose: the one that runs `npm ci` (every dependency's install scripts) can only read the repository and holds no
# credentials; the one that can write releases never runs project code, it only uploads what the first built.
# Actions are pinned to a commit (the tag is in the comment).
name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: The tag is the version
        id: version
        shell: bash
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-suffix]" >&2
            exit 1
          fi
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Check (texts, literals, types)
        run: npm run check

      - name: Build the installer
        run: npm run dist

      - name: Smoke test of the unpacked app
        run: npm run smoke:app

      # latest.yml and the blockmap are what the installed app reads to find and download this version.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            release/AndromedaCli-Setup-*.exe
            release/AndromedaCli-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the release and uploading the installer
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "release/AndromedaCli-Setup-$VERSION.exe" "release/AndromedaCli-Setup-$VERSION.exe.blockmap" release/latest.yml \
            --title "AndromedaCli $VERSION" --generate-notes $flags
