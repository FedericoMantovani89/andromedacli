# The full test suite on GitHub, so it does not have to run on a laptop: every push to main and every pull request.
# Windows on purpose: the tests drive real node-pty children, real git and PowerShell, as the app does.
# Same pinning and read-only token as release.yml: nothing here can write to the repository.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check (texts, literals, types)
        run: npm run check

      # The server tests read the built UI.
      - name: Build the UI
        run: npm run build

      # The runner's default temp folder is in 8.3 form (C:\Users\RUNNER~1\...), while git answers with the long path: tests that compare
      # the two fail. The runner temp folder has no short names.
      # scripts/ci-tests.sh: if a worker dies with no test failing (a native crash of node-pty on this runner), the files whose worker died
      # run once more; a failing test, or a second crash, fails the job.
      - name: Tests
        shell: bash
        run: bash scripts/ci-tests.sh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
