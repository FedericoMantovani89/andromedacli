<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AndromedaCli %VERSION%</title>
  <link rel="stylesheet" href="/xterm.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- No visible text here: every label is filled from the .properties bundles by main.ts (P12). -->
  <header id="topbar">
    <div id="brand" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-24 12 12)"/><ellipse cx="12" cy="12" rx="6.2" ry="2.3" transform="rotate(-24 12 12)" opacity=".55"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg></div>
    <nav id="tabs"></nav>
    <div id="actions">
      <button id="queue-btn" type="button"></button>
      <button id="settings-btn" type="button"></button>
    </div>
  </header>
  <!-- One .plan-ws (main column and agents column) per open plan is added by main.ts. -->
  <main id="workspace"></main>
  <footer id="statusbar"></footer>
  <aside id="drawer" hidden></aside>
  <aside id="reader" hidden></aside>
  <div id="overlay" hidden></div>
  <!-- Start-up splash (decorative: the name is in the picture; %VERSION% is filled in by the server). It never takes clicks or keys. -->
  <div id="splash" aria-hidden="true"><div class="splash-frame"><img src="/splash.jpg" alt=""><span id="splash-version">%VERSION%</span></div></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
